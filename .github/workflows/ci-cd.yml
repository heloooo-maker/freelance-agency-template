name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: registry.thanhlam.online
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry.thanhlam.online/freelance-agency-template:${{ github.sha }}
            registry.thanhlam.online/freelance-agency-template:latest

      # No "update GitOps repo" step: argocd-image-updater watches
      # registry.thanhlam.online/freelance-agency-template directly and
      # writes the new tag into app/development/freelance-agency-template/
      # values.yaml itself once this push lands.
